# Razlom — FiveM Server Configuration

## Основные настройки
sv_hostname "Razlom | Invasion Survival RP"
sv_maxclients 64
sv_endpointprivacy true

## Сетевые настройки
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

## Лицензионные ключи (ЗАМЕНИТЬ!)
sv_licenseKey "changeme"
steam_webApiKey "changeme"

## База данных
set mysql_connection_string "mysql://apo:password@localhost/apo?charset=utf8mb4"

## Ресурсы - База данных
ensure oxmysql

## Ресурс карты (Post-Apocalyptic Los Santos)
# Установите ресурс карты в resources/ и раскомментируйте/обновите имя при необходимости
ensure gabz_postapols

## Ресурсы - Ядро Razlom
ensure apo_core
ensure apo_player
ensure apo_inventory
ensure apo_weapons
ensure apo_ui

## Ресурсы - Новые системы
ensure apo_invasion
ensure apo_progression
ensure apo_signal

## Игровые настройки
set sv_enforceGameBuild 2699

## OneSync (для больших серверов)
set onesync on

## Логирование
set sv_scriptHookAllowed 0
set sv_debugqueue true

## Whitelist (опционально)
# set sv_endpointprivacy true
# add_ace resource.sessionmanager command.slogin allow

## Дополнительные настройки
sets locale "ru-RU"
sets tags "Razlom, Survival, RP, PvE, Invasion"

