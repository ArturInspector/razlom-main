<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAZLOM - UI</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- Эффекты постобработки -->
    <div class="overlay"></div>
    <div class="scanlines"></div>
    <div id="contamination-overlay" class="contamination-overlay"></div>
    
    <!-- ═══════════════════════════════════════════════════ -->
    <!-- HUD - Основной интерфейс -->
    <!-- ═══════════════════════════════════════════════════ -->
    <div id="hud" class="hud">
        <div class="hud-top">
            <div class="threat-bar" id="threat-bar">
                <div class="threat-title">THREAT LEVEL</div>
                <div class="threat-meter">
                    <div class="threat-fill" id="threat-fill" style="width: 0%"></div>
                    <div class="threat-value" id="threat-value">0 / 10</div>
                </div>
                <div class="threat-status" id="threat-status">Low signal</div>
            </div>
        </div>
        
        <div class="hud-main">
            <!-- Левая панель -->
            <div class="hud-left">
                <div class="stat-card" id="card-health">
                    <div class="stat-header">
                        <img class="stat-icon" src="assets/images/icon-health.svg" alt="Health">
                        <div class="stat-label">HEALTH</div>
                        <div class="stat-number" id="health-value">100%</div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill health" id="health-bar" style="width: 100%"></div>
                    </div>
                </div>

                <div class="stat-card" id="card-radiation">
                    <div class="stat-header">
                        <img class="stat-icon" src="assets/images/icon-radiation.svg" alt="Radiation">
                        <div class="stat-label">RADIATION</div>
                        <div class="stat-number" id="radiation-value">0%</div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill radiation" id="radiation-bar" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Правая панель -->
            <div class="hud-right">
                <div class="mini-card" id="card-weight">
                    <img class="stat-icon" src="assets/images/icon-inventory.svg" alt="Inventory">
                    <div class="mini-label">CARRY</div>
                    <div class="mini-value" id="weight-value">0/50</div>
                </div>
                <div class="mini-card" id="card-thirst">
                    <img class="stat-icon" src="assets/images/icon-thirst.svg" alt="Thirst">
                    <div class="mini-label">HYDRATION</div>
                    <div class="mini-value" id="thirst-value">100%</div>
                </div>
                <div class="mini-card" id="card-hunger">
                    <img class="stat-icon" src="assets/images/icon-hunger.svg" alt="Hunger">
                    <div class="mini-label">NUTRITION</div>
                    <div class="mini-value" id="hunger-value">100%</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- ═══════════════════════════════════════════════════ -->
    <!-- Уведомления -->
    <!-- ═══════════════════════════════════════════════════ -->
    <div id="notifications" class="notifications"></div>
    
    <!-- ═══════════════════════════════════════════════════ -->
    <!-- Модальные окна (Инвентарь, Крафт и т.д.) -->
    <!-- ═══════════════════════════════════════════════════ -->
    <div id="modal-container" class="modal-container" style="display: none;">
        <!-- Динамически генерируемые меню -->
        <div id="inventory-menu" class="inventory-container" style="display: none;">
            <div class="inventory-header">
                <div class="inventory-title">RIFT PACK</div>
                <div class="inventory-weight" id="inv-weight-text">ВЕС: 0.0/50.0 кг</div>
            </div>
            
            <div class="inventory-main">
                <div class="inventory-grid" id="inv-grid">
                    <!-- Предметы будут здесь -->
                </div>
                
                <div class="inventory-info" id="inv-info">
                    <div class="info-empty">ВЫБЕРИТЕ ПРЕДМЕТ</div>
                    <!-- Информация о предмете -->
                </div>
            </div>
            
            <div class="inventory-footer">
                <button class="btn btn-secondary" onclick="sendCallback('close')">ЗАКРЫТЬ [ESC]</button>
            </div>
        </div>

        <div id="crafting-menu" class="crafting-container" style="display: none;">
            <div class="crafting-header">
                <div class="crafting-title">FORGE</div>
                <div class="crafting-subtitle">ПРОТОКОЛ СБОРКИ</div>
            </div>

            <div class="crafting-main">
                <div class="crafting-list" id="craft-list">
                    <!-- Рецепты будут здесь -->
                </div>

                <div class="crafting-info" id="craft-info">
                    <div class="info-empty">ВЫБЕРИТЕ РЕЦЕПТ</div>
                </div>
            </div>

            <div class="crafting-footer">
                <button class="btn btn-secondary" onclick="sendCallback('close')">ЗАКРЫТЬ [ESC]</button>
            </div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/events.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
